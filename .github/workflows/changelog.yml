name: Update Development Changelog

on:
  push:
    branches-ignore:
      - master
    paths-ignore:
      - "CHANGELOG.md"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  changelog:
    name: Update CHANGELOG.md

    if: github.ref != 'refs/heads/master'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch all tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --force --tags

      - name: Generate development changelog
        shell: bash
        env:
          REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail

          BRANCH="${GITHUB_REF_NAME}"

          PREVIOUS_TAG=$(
            git tag \
              --list '*+*' \
              --sort=-version:refname |
              head -n 1
          )

          if [[ -n "$PREVIOUS_TAG" ]]; then
            if git merge-base --is-ancestor "$PREVIOUS_TAG" HEAD; then
              COMMIT_RANGE="${PREVIOUS_TAG}..HEAD"
              echo "Using release tag: ${PREVIOUS_TAG}"
            else
              COMMON_BASE=$(git merge-base "$PREVIOUS_TAG" HEAD)
              COMMIT_RANGE="${COMMON_BASE}..HEAD"

              echo "Release tag ${PREVIOUS_TAG} is not an ancestor of this branch."
              echo "Using common base: ${COMMON_BASE}"
            fi
          else
            echo "No release tag was found."
            echo "The changelog cannot be generated safely."
            exit 1
          fi

          {
            echo "# Development Changelog"
            echo
            echo "**Branch:** \`${BRANCH}\`"
            echo
            echo "**Changes since:** \`${PREVIOUS_TAG}\`"
            echo
            echo "> This file is generated automatically from commits."
            echo "> The official release notes are maintained manually in \`CHANGELOG_RELEASE.md\`."
            echo
            echo "## Unreleased"
            echo

            git log "$COMMIT_RANGE" \
              --no-merges \
              --reverse \
              --invert-grep \
              --grep="^Update automatic changelog$" \
              --pretty=format:"- [%h](https://github.com/${REPOSITORY}/commit/%H) %s"

            echo
          } > CHANGELOG.md

      - name: Commit updated changelog
        shell: bash
        run: |
          set -euo pipefail

          git add CHANGELOG.md

          if git diff --cached --quiet; then
            echo "CHANGELOG.md is already current."
            exit 0
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git commit -m "Update automatic changelog"
          git push