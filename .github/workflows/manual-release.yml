name: Manual Release HCR+

on:
  workflow_dispatch:
    inputs:
      branch:
        description: "Branch to release"
        required: true
        type: choice
        options:
          - 26.2
          - 26.1.2

permissions:
  contents: write

jobs:
  release:
    name: Build and Publish HCR+
    runs-on: ubuntu-latest

    steps:
      - name: Checkout selected branch
        uses: actions/checkout@v6
        with:
          ref: ${{ inputs.branch }}
          fetch-depth: 0
          fetch-tags: true

      - name: Fetch release tags
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin --force --tags

      - name: Read release version
        id: version
        shell: bash
        run: |
          set -euo pipefail

          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2-)
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2-)
          SUPPORTED_MINECRAFT_VERSIONS=$(grep '^supported_minecraft_versions=' gradle.properties | cut -d'=' -f2-)

          if [[ -z "$MOD_VERSION" ]]; then
            echo "mod_version is missing from gradle.properties."
            exit 1
          fi

          if [[ -z "$MINECRAFT_VERSION" ]]; then
            echo "minecraft_version is missing from gradle.properties."
            exit 1
          fi

          if [[ -z "$SUPPORTED_MINECRAFT_VERSIONS" ]]; then
            echo "supported_minecraft_versions is missing from gradle.properties."
            exit 1
          fi

          FULL_VERSION="${MOD_VERSION}+${MINECRAFT_VERSION}"

          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "supported_minecraft_versions=$SUPPORTED_MINECRAFT_VERSIONS" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

          echo "Release version: $FULL_VERSION"
          echo "Selected branch: ${{ inputs.branch }}"

      - name: Validate selected branch
        shell: bash
        env:
          SELECTED_BRANCH: ${{ inputs.branch }}
          MINECRAFT_VERSION: ${{ steps.version.outputs.minecraft_version }}
        run: |
          set -euo pipefail

          if [[ "$SELECTED_BRANCH" != "$MINECRAFT_VERSION" ]]; then
            echo "Selected branch and minecraft_version do not match."
            echo "Branch: $SELECTED_BRANCH"
            echo "minecraft_version: $MINECRAFT_VERSION"
            exit 1
          fi

      - name: Validate release changelog
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s CHANGELOG_RELEASE.md ]]; then
            echo "CHANGELOG_RELEASE.md is missing or empty."
            exit 1
          fi

          if ! grep -Eq \
            '^[[:space:]]*[-*][[:space:]]+[^[:space:]]' \
            CHANGELOG_RELEASE.md; then

            echo "CHANGELOG_RELEASE.md does not contain a release entry."
            exit 1
          fi

      - name: Check existing release tag
        shell: bash
        env:
          TAG_NAME: ${{ steps.version.outputs.full_version }}
        run: |
          set -euo pipefail

          if git ls-remote \
            --exit-code \
            --tags \
            origin \
            "refs/tags/${TAG_NAME}" > /dev/null 2>&1; then

            echo "The tag ${TAG_NAME} already exists."
            exit 1
          fi

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build public release artifacts
        run: ./gradlew buildRelease

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -n "$(find build/libs/datapackmod -maxdepth 1 -name '*.jar' -print -quit)"
          test -n "$(find build/distributions/datapack -maxdepth 1 -name '*.zip' -print -quit)"

      - name: Prepare supported Minecraft versions
        id: supported-versions
        shell: bash
        env:
          SUPPORTED_VERSIONS: ${{ steps.version.outputs.supported_minecraft_versions }}
        run: |
          set -euo pipefail

          {
            echo "versions<<EOF"
            echo "$SUPPORTED_VERSIONS" |
              tr ',' '\n' |
              sed 's/^[[:space:]]*//;s/[[:space:]]*$//' |
              sed '/^$/d'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Supported Minecraft versions:"
          echo "$SUPPORTED_VERSIONS" | tr ',' '\n'

      - name: Upload release artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hardcore-revive-plus-${{ steps.version.outputs.full_version }}
          if-no-files-found: error
          path: |
            build/libs/datapackmod/*.jar
            build/distributions/datapack/*.zip

      - name: Publish to Modrinth and GitHub
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: Huz7HM6Q
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ steps.version.outputs.full_version }}
          github-commitish: ${{ github.sha }}
          github-generate-changelog: false
          github-draft: false
          github-prerelease: false

          name: Hardcore Revive+ v${{ steps.version.outputs.mod_version }}
          version: ${{ steps.version.outputs.full_version }}
          version-type: release

          changelog-file: CHANGELOG_RELEASE.md

          files: |
            build/libs/datapackmod/*.jar
            build/distributions/datapack/*.zip

          game-versions: |
            ${{ steps.supported-versions.outputs.versions }}

          game-version-filter: none

          loaders: |
            datapack
            fabric
            quilt
            neoforge

          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000