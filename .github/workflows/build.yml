name: Build and Publish HCR+

on:
  push:
    branches:
      - master
    paths:
      - "gradle.properties"

  pull_request:
    paths:
      - "gradle.properties"

  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-version:
    name: Check version change
    runs-on: ubuntu-latest

    outputs:
      version_changed: ${{ steps.version.outputs.version_changed }}
      mod_version: ${{ steps.version.outputs.mod_version }}
      minecraft_version: ${{ steps.version.outputs.minecraft_version }}
      supported_minecraft_versions: ${{ steps.version.outputs.supported_minecraft_versions }}
      full_version: ${{ steps.version.outputs.full_version }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Read and compare versions
        id: version
        shell: bash
        run: |
          set -euo pipefail

          MOD_VERSION=$(grep '^mod_version=' gradle.properties | cut -d'=' -f2-)
          MINECRAFT_VERSION=$(grep '^minecraft_version=' gradle.properties | cut -d'=' -f2-)
          SUPPORTED_MINECRAFT_VERSIONS=$(grep '^supported_minecraft_versions=' gradle.properties | cut -d'=' -f2-)
          FULL_VERSION="${MOD_VERSION}+${MINECRAFT_VERSION}"

          VERSION_CHANGED=false

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            VERSION_CHANGED=false

          elif [[ "${{ github.event_name }}" == "pull_request" ]]; then
            VERSION_CHANGED=true

          elif [[ "${{ github.event_name }}" == "push" ]]; then
            BEFORE_SHA="${{ github.event.before }}"

            if [[ "$BEFORE_SHA" == "0000000000000000000000000000000000000000" ]]; then
              VERSION_CHANGED=true

            elif git cat-file -e "${BEFORE_SHA}:gradle.properties" 2>/dev/null; then
              PREVIOUS_MOD_VERSION=$(
                git show "${BEFORE_SHA}:gradle.properties" |
                grep '^mod_version=' |
                cut -d'=' -f2-
              )

              if [[ "$MOD_VERSION" != "$PREVIOUS_MOD_VERSION" ]]; then
                VERSION_CHANGED=true
              fi

              echo "Previous mod version: $PREVIOUS_MOD_VERSION"
            else
              VERSION_CHANGED=true
            fi
          fi

          echo "version_changed=$VERSION_CHANGED" >> "$GITHUB_OUTPUT"
          echo "mod_version=$MOD_VERSION" >> "$GITHUB_OUTPUT"
          echo "minecraft_version=$MINECRAFT_VERSION" >> "$GITHUB_OUTPUT"
          echo "supported_minecraft_versions=$SUPPORTED_MINECRAFT_VERSIONS" >> "$GITHUB_OUTPUT"
          echo "full_version=$FULL_VERSION" >> "$GITHUB_OUTPUT"

          echo "Current mod version: $MOD_VERSION"
          echo "Minecraft build version: $MINECRAFT_VERSION"
          echo "Supported Minecraft versions: $SUPPORTED_MINECRAFT_VERSIONS"
          echo "Full version: $FULL_VERSION"
          echo "Version changed: $VERSION_CHANGED"

  build:
    name: Build HCR+
    needs: check-version

    if: >
      github.event_name == 'pull_request' ||
      github.event_name == 'workflow_dispatch' ||
      needs.check-version.outputs.version_changed == 'true'

    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Setup Java 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 25

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Make Gradle wrapper executable
        run: chmod +x gradlew

      - name: Build public release artifacts
        run: ./gradlew buildRelease

      - name: Verify release artifacts
        shell: bash
        run: |
          set -euo pipefail

          test -n "$(find build/libs/datapackmod -maxdepth 1 -name '*.jar' -print -quit)"
          test -n "$(find build/distributions/datapack -maxdepth 1 -name '*.zip' -print -quit)"

      - name: Verify manual release changelog
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          needs.check-version.outputs.version_changed == 'true'
        shell: bash
        run: |
          set -euo pipefail

          if [[ ! -s CHANGELOG_RELEASE.md ]]; then
            echo "CHANGELOG_RELEASE.md is missing or empty."
            exit 1
          fi

          CONTENT_LINES=$(grep -Ev \
            '^[[:space:]]*$|^[[:space:]]*#|^[[:space:]]*<!--|^[[:space:]]*-->' \
            CHANGELOG_RELEASE.md || true)

          if [[ -z "$CONTENT_LINES" ]]; then
            echo "CHANGELOG_RELEASE.md contains only headings or empty lines."
            echo "Write the release notes before increasing mod_version."
            exit 1
          fi

          BULLET_CONTENT=$(grep -E '^[[:space:]]*[-*][[:space:]]+[^[:space:]]' \
            CHANGELOG_RELEASE.md || true)

          if [[ -z "$BULLET_CONTENT" ]]; then
            echo "CHANGELOG_RELEASE.md does not contain any release entries."
            echo "Add at least one bullet point before publishing."
            exit 1
          fi

          echo "Release changelog is valid."

      - name: Prepare supported Minecraft versions
        id: supported-versions
        shell: bash
        env:
          SUPPORTED_VERSIONS: ${{ needs.check-version.outputs.supported_minecraft_versions }}
        run: |
          set -euo pipefail

          {
            echo "versions<<EOF"
            echo "$SUPPORTED_VERSIONS" | tr ',' '\n' | sed '/^[[:space:]]*$/d'
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

          echo "Supported Minecraft versions:"
          echo "$SUPPORTED_VERSIONS" | tr ',' '\n'

      - name: Upload build artifacts
        uses: actions/upload-artifact@v7
        with:
          name: hardcore-revive-plus-${{ needs.check-version.outputs.full_version }}
          if-no-files-found: error
          path: |
            build/libs/datapackmod/*.jar
            build/distributions/datapack/*.zip

      - name: Check existing release tag
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          needs.check-version.outputs.version_changed == 'true'
        shell: bash
        env:
          TAG_NAME: ${{ needs.check-version.outputs.full_version }}
        run: |
          set -euo pipefail

          if git ls-remote --exit-code --tags origin "refs/tags/${TAG_NAME}" > /dev/null 2>&1; then
            echo "The tag ${TAG_NAME} already exists."
            exit 1
          fi

      - name: Publish to Modrinth and GitHub
        if: >
          github.event_name == 'push' &&
          github.ref == 'refs/heads/master' &&
          needs.check-version.outputs.version_changed == 'true'
        uses: Kira-NT/mc-publish@v3
        with:
          modrinth-id: Huz7HM6Q
          modrinth-token: ${{ secrets.MODRINTH_TOKEN }}
          modrinth-featured: true

          github-token: ${{ secrets.GITHUB_TOKEN }}
          github-tag: ${{ needs.check-version.outputs.full_version }}
          github-commitish: ${{ github.sha }}
          github-generate-changelog: false
          github-draft: false
          github-prerelease: false

          name: Hardcore Revive+ v${{ needs.check-version.outputs.mod_version }}
          version: ${{ needs.check-version.outputs.full_version }}
          version-type: release

          changelog-file: CHANGELOG_RELEASE.md

          files: |
            build/libs/datapackmod/*.jar
            build/distributions/datapack/*.zip

          game-versions: |
            ${{ steps.supported-versions.outputs.versions }}

          game-version-filter: none

          loaders: |
            datapack
            fabric
            quilt
            neoforge

          fail-mode: fail
          retry-attempts: 3
          retry-delay: 10000